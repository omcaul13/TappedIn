# Builds TappedIn-Setup-<version>.exe and attaches it to a GitHub Release.
#   Push a tag like v0.2.0  -> a signed installer on the v0.2.0 release (needs the EVS secrets below).
#   Run it by hand          -> an unsigned test installer as a workflow artifact (video won't play).
# Repo secrets for signing (Settings -> Secrets and variables -> Actions): EVS_ACCOUNT_NAME and
# EVS_PASSWD, the castLabs EVS account that signs the video player for Widevine.
name: Release installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNED: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        if: env.SIGNED == 'true'
        with:
          python-version: '3.12'

      - name: Install the signing tool and Inno Setup
        shell: pwsh
        run: |
          if ($env:SIGNED -eq 'true') { python -m pip install --disable-pip-version-check castlabs-evs==1.3.2 truststore==0.10.5 }
          choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
        run: |
          if ($env:SIGNED -eq 'true') {
            if (-not $env:EVS_ACCOUNT_NAME -or -not $env:EVS_PASSWD) { throw 'Set the EVS_ACCOUNT_NAME and EVS_PASSWD repo secrets to build a signed release.' }
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Unsigned
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach to the release
        if: env.SIGNED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag (Get-Item dist/*.exe) --clobber } else { gh release create $tag (Get-Item dist/*.exe) --generate-notes }

      # The website (website/, Cloudflare Pages) serves the installer from a private R2 bucket. Repo secrets:
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (an R2 API token with write access to tappedin-downloads).
      - name: Publish the installer on the website
        if: env.SIGNED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't take the checksums newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if (-not $env:R2_ACCOUNT_ID) { Write-Warning 'R2 secrets are not set: the website still offers the previous installer.'; exit 0 }
          $tag = '${{ github.ref_name }}'
          $exe = Get-Item dist/*.exe | Select-Object -First 1
          gh release view $tag --json body --jq .body | node website/release-info.mjs $tag $exe.FullName | Set-Content latest.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r2 = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # The installer first, so latest.json never names a version the site can't serve yet.
          aws s3 cp $exe.FullName s3://tappedin-downloads/TappedIn-Setup.exe --endpoint-url $r2 --content-type application/vnd.microsoft.portable-executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          aws s3 cp latest.json s3://tappedin-downloads/latest.json --endpoint-url $r2 --content-type application/json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the test installer
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TappedIn-Setup-unsigned
          path: dist/*.exe
